<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tag Design 1</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: #080808;
        background: #fff;
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        min-height: 100svh;
        display: grid;
        grid-template-rows: 1fr 1fr;
      }

      .sample {
        display: grid;
        place-items: center;
        min-height: 340px;
        padding: 64px 24px;
        overflow: hidden;
      }

      /* The pill has a cool, raised rim and a soft green reflection below it. */
      .collection-tag {
        position: relative;
        isolation: isolate;
        display: inline-flex;
        align-items: center;
        gap: 23px;
        padding: 19px 39px 19px 19px;
        border: 1px solid #d6dde2;
        border-radius: 100px;
        background: linear-gradient(180deg, #f6f8fa 0%, #eceef0 20%, #e4e5e6 55%, #eef0f1 82%, #fafcfd 100%);
        box-shadow:
          -3px 1px 0 #cbd1d780,
          -5px 1px 0 #e8ecef,
          inset 0 0 0 3px #f5f7f9,
          inset 0 5px 7px #ffffffb3,
          inset 0 -4px 6px #ffffffd9,
          0 5px 10px #677b8710;
        white-space: nowrap;
        font: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform .28s ease, box-shadow .28s ease;
      }

      .collection-tag::before {
        content: "";
        position: absolute;
        z-index: -1;
        left: 13px;
        bottom: -25px;
        width: 147px;
        height: 67px;
        border-radius: 50%;
        background: #37df9226;
        filter: blur(24px);
        transition: opacity .3s ease, transform .3s ease;
      }

      .arrow-badge {
        position: relative;
        isolation: isolate;
        display: grid;
        place-items: center;
        flex: 0 0 126px;
        width: 126px;
        height: 126px;
        border-radius: 50%;
        background: conic-gradient(from 10deg, #21d78c, #19bd79 26%, #149e64 53%, #109b5e 72%, #2ad88b 92%, #21d78c);
        box-shadow:
          inset 1px 1px 1px #50e8a0,
          inset -1px -2px 2px #087d5045,
          -1px 2px 2px #08774724,
          0 8px 18px -12px #0eaa6b66;
        transition: transform .3s ease, filter .3s ease;
      }

      .arrow-badge::before,
      .arrow-badge::after {
        content: "";
        position: absolute;
        border-radius: 50%;
      }

      .arrow-badge::before {
        inset: 5px;
        background: linear-gradient(150deg, #bbf6d6 0%, #94edbd 30%, #65dfa4 65%, #8aeabd 100%);
        box-shadow: 0 1px 1px #08784933;
      }

      .arrow-badge::after {
        inset: 10px;
        background: linear-gradient(145deg, #1ac878 0%, #1bc57b 60%, #1bc17d 100%);
        box-shadow: inset 0 1px 2px #0b9c5b24, inset 0 -1px 2px #4de69e66;
      }

      .arrow-badge svg {
        position: relative;
        z-index: 1;
        width: 53px;
        height: 58px;
        fill: none;
        stroke: #f4fff5;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 1px 1px #07865024);
        transition: transform .3s ease;
      }

      .collection-label {
        color: #a09d94;
        font-size: 64px;
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: -1.8px;
        text-shadow: 0 1px 1px #fff, 0 -1px 1px #6d68572b;
        transition: color .3s ease;
      }

      @media (hover: hover) and (pointer: fine) {
        .collection-tag:hover {
          box-shadow:
            -3px 1px 0 #cbd1d780,
            -5px 1px 0 #e8ecef,
            inset 0 0 0 3px #f5f7f9,
            inset 0 7px 12px 2px #64697038,
            inset 0 -3px 7px #ffffffb3,
            0 12px 24px -10px #677b8730;
        }

        .collection-tag:hover::before {
          opacity: 1;
          transform: translateY(5px) scale(1.35);
        }

        .collection-tag:hover .arrow-badge {
          transform: scale(1.025);
          filter: saturate(1.12) brightness(1.025);
        }

        .collection-tag:hover .collection-label { color: #000; }
      }

      .collection-tag:focus-visible {
        outline: 3px solid #21bc7b;
        outline-offset: 8px;
      }

      .collection-tag:active {
        transform: translateY(1px) scale(.985);
        transition-duration: .1s;
      }

      .sample-live { background: #f5f5f5; }

      .live-tag {
        display: inline-flex;
        align-items: center;
        gap: 29px;
        padding: 0 30px 0 68px;
        min-height: 216px;
        position: relative;
        isolation: isolate;
      }

      .live-tag::before,
      .live-tag::after {
        content: "";
        position: absolute;
        z-index: -1;
        left: 0;
        top: 0;
        width: 216px;
        height: 216px;
        border-radius: 50%;
        background: #f0eff5;
        opacity: 0;
        /* Each expansion lasts 1.4s. Alternate starts are 1.12s apart
           (80% progress), giving a 0.28s overlap. */
        animation: halo-expand 2.24s linear infinite;
      }

      .live-tag::after {
        animation-delay: 1.12s;
      }

      .live-dot {
        position: relative;
        isolation: isolate;
        flex: 0 0 78px;
        width: 78px;
        height: 78px;
        border-radius: 50%;
        box-shadow: 0 14px 24px -8px #9567ef40;
      }

      .live-dot::before,
      .live-dot::after {
        content: "";
        position: absolute;
        border-radius: 50%;
      }

      .live-dot::before {
        inset: 0;
        background: conic-gradient(from 0deg, #c7afff, #9465ff 20%, #7745f9 40%, #b895ff 60%, #7643ff 77%, #d4bdff 93%, #c7afff);
      }

      .live-dot::after {
        inset: 7px;
        border: 7px solid #e2d7ff;
        background: linear-gradient(145deg, #cdbefa, #c9b8f8);
        box-shadow: inset 0 2px 3px #ffffff40, 0 0 2px #ffffff66;
      }

      @keyframes halo-expand {
        0% { transform: scale(.36); background: #e2dcf2; opacity: 1; }
        /* 31.25% of the full cycle = 50% of the active expansion. */
        31.25% { transform: scale(.755); background: #f0eff5; opacity: 1; }
        62.5%, 100% { transform: scale(1.15); background: #f5f5f5; opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .live-tag::before { animation: none; opacity: 1; }
        .live-tag::after { animation: none; }
        .collection-tag,
        .collection-tag::before,
        .collection-tag .arrow-badge,
        .collection-tag .arrow-badge svg,
        .collection-label { transition: none; animation: none; }
      }

      .live-label {
        font-size: 76px;
        font-weight: 400;
        letter-spacing: -2.8px;
        line-height: 1;
      }

      @media (max-width: 680px) {
        .collection-tag { zoom: .64; }
        .live-tag { zoom: .82; }
        .sample { min-height: 280px; padding: 48px 16px; }
      }

      @media (max-width: 380px) {
        .collection-tag { zoom: .52; }
      }
    </style>
  </head>
  <body>
    <main aria-label="两款标签设计">
      <section class="sample" aria-label="绿色箭头胶囊标签">
        <button class="collection-tag" type="button">
          <span class="arrow-badge" aria-hidden="true">
            <svg viewBox="0 0 53 58">
              <path d="M26.5 49V10M10 26.5 26.5 10 43 26.5" />
            </svg>
          </span>
          <span class="collection-label">My Collection</span>
        </button>
      </section>
      <section class="sample sample-live" aria-label="紫色 Live 状态标签">
        <span class="live-tag">
          <span class="live-dot" aria-hidden="true"></span>
          <span class="live-label">Live</span>
        </span>
      </section>
    </main>
  </body>
</html>
